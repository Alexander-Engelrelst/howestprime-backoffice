name: "CI: Validate & Build Main"

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
#on:
#  push:
#    branches: [ main ]
# Added to avoid trying to push to production since the infrastructure does not exist anymore
on: 
  workflow_dispatch: 
    
jobs: 
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions: 
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '10.0.x'
      
      - name: Make release
        run: |
          dotnet restore
          dotnet publish ./Howestprime.Backoffice/Howestprime.Backoffice.csproj -c Release -o build
          
      - name: Zip the release
        run: |
          cd build
          zip -r ../build.zip .
          cd ..
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.zip
            
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions: {}
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .
          
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }}",
              "clientSecret": "${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }}",
              "tenantId": "${{ vars.AZ_TENANT_ID }}",
              "subscriptionId": "${{ vars.AZ_SUBSCRIPTION_ID }}"
            }

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.HOWESTPRIME_BACKOFFICE_WEBAPP }}
          package: build.zip