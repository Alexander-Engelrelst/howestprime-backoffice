<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dynamic Movie Calendar + Modal (No Alerts)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="planning.css">
</head>
<body>

  <div class="app-container">
    <!-- HEADER: Icon + Title (Left), Nav Bar (Right) -->
    <header class="app-header">
      <i class="fa-solid fa-clapperboard"></i>
      <h1>Movie Events</h1>
      <nav class="header-nav">
        <ul>
          <li><a href="#" class="active">Plan</a></li>
          <li><a href="#">Register</a></li>
        </ul>
      </nav>
    </header>
    
    <!-- CALENDAR CONTENT -->
    <main class="app-content">
      <!-- Month Navigation with Legend -->
      <div class="month-nav-container">
        <div class="room-legend">
          <div class="room-legend-item">
            <div class="room-legend-color room-legend-blue"></div>
            <span>Room I</span>
          </div>
          <div class="room-legend-item">
            <div class="room-legend-color room-legend-yellow"></div>
            <span>Room II</span>
          </div>
        </div>
        <div class="month-nav">
          <button class="prev-month" onclick="calendarApp.changeMonth(-1)">&larr;</button>
          <h2 class="month-year" id="monthYear"></h2>
          <button class="next-month" onclick="calendarApp.changeMonth(1)">&rarr;</button>
        </div>
        <div style="width: 100px;"></div> <!-- Empty div for balanced spacing -->
      </div>

      <!-- Day-of-week Header (7 cells for Sun..Sat) -->
      <div class="calendar-grid">
        <div class="day-name">Sun</div>
        <div class="day-name">Mon</div>
        <div class="day-name">Tue</div>
        <div class="day-name">Wed</div>
        <div class="day-name">Thu</div>
        <div class="day-name">Fri</div>
        <div class="day-name">Sat</div>
      </div>

      <!-- Actual day cells go here (dynamically, no blanks) -->
      <div class="calendar-grid" id="calendarDays"></div>
    </main>
    
    <!-- FOOTER -->
    <footer class="app-footer">
      <h2>Howest prime - backoffice</h2>
    </footer>
  </div>

  <!-- MODAL OVERLAY -->
  <div class="modal-overlay" id="addEventModal">
    <div class="modal-content">
      <div class="modal-header">
        <i class="fa-solid fa-clapperboard"></i>
        <h2>Add Movie Event</h2>
      </div>
      <!-- The form to choose Room, Time, Movie -->
      <form class="modal-form" id="modalForm">
        <input type="hidden" id="modalDay" />
        <input type="hidden" id="modalMonth" />
        <input type="hidden" id="modalYear" />
        
        <div class="form-group">
          <label for="modalRoom">Room</label>
          <select id="modalRoom" class="form-control" required>
            <option value="">-- Choose a Room --</option>
            <option value="event-room1">Room I</option>
            <option value="event-room2">Room II</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="modalTime">Time</label>
          <select id="modalTime" class="form-control" required>
            <option value="">-- Choose a Time --</option>
            <option value="15:00">15:00</option>
            <option value="19:00">19:00</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="modalMovie">Movie</label>
          <select id="modalMovie" class="form-control" required>
            <option value="">-- Choose a Movie --</option>
            <option value="Dune">Dune</option>
            <option value="Star Wars">Star Wars</option>
            <option value="Inception">Inception</option>
            <option value="Interstellar">Interstellar</option>
            <option value="Mulan">Mulan</option>
          </select>
        </div>
        
        <button type="submit" class="modal-submit-btn">Save Event</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
